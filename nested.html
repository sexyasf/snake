<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>nested</title>
  </head>
  <body>
    <pre id="output" style="line-height: 1">
      sss
    </pre>
    <script>
      // nested loop

      // let result = "";
      // const n = 6;

      // let k = 0;
      // while (k < n) {
      //   let i = 0;
      //   while (i < k + 1) {
      //     result = result + "*";
      //     i++;
      //   }

      //   result = result + "\n";
      //   k++;
      // }
      // document.getElementById("output").textContent = result;

      let result = "";
      const n = 6;

      for (let j = 0; j < n; j++) {
        for (let i = 0; i < n - 1 - j; i++) {
          result = result + " ";
        }

        for (let i = 0; i < j + 1; i++) {
          result = result + "* ";
        }

        result = result + "\n";
      }

      document.getElementById("output").textContent = result;
    </script>
  </body>
</html>
